[project]
name = "prosmem"
version = "1.0.0"
description = "Interrupt-Driven Prospective Memory for LLM Agents"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",                # OpenAI-compatible chat-completions client
    "httpx>=0.27",                # HTTP client used by agent.llm (proxy support)
    "sentence-transformers>=3.0", # Local BGE embedding
    "numpy>=1.24",
    "pydantic>=2.0",
    "rich>=13.0",                 # CLI output formatting
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prosmem*"]
